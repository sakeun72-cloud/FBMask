<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animierter Produkt- & Banner Generator (HD + Bild Export)</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { max-width: 1380px; margin: 1.5rem auto; padding: 0 1rem; background: #0f172a; color: #f8fafc; }
    h1 { text-align: center; font-size: 1.75rem; margin-bottom: 0.25rem; color: #38bdf8; }
    p.subtitle { text-align: center; color: #94a3b8; font-size: 0.95rem; margin-bottom: 1.5rem; }
    
    .app-layout { display: grid; grid-template-columns: 440px 1fr; gap: 1.5rem; align-items: start; }
    @media (max-width: 960px) { .app-layout { grid-template-columns: 1fr; } }
    
    .controls { background: #1e293b; padding: 1.25rem; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4); max-height: 88vh; overflow-y: auto; border: 1px solid #334155; }
    .preview { background: #1e293b; padding: 1.25rem; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4); text-align: center; border: 1px solid #334155; position: sticky; top: 1.5rem; }
    
    .section-head { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 0.3rem; margin: 1.2rem 0 0.8rem 0; }
    .section-head:first-of-type { margin-top: 0; }
    
    .field { margin-bottom: 0.75rem; }
    label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.25rem; color: #cbd5e1; }
    input[type="text"], textarea, input[type="file"], select, input[type="number"] { width: 100%; padding: 0.5rem; background: #0f172a; border: 1px solid #334155; border-radius: 6px; font-size: 0.85rem; color: #fff; }
    textarea { resize: vertical; height: 95px; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; }
    
    canvas { width: 100%; max-width: 540px; height: auto; border-radius: 10px; box-shadow: 0 20px 30px -10px rgba(0,0,0,0.6); }
    
    .btn-group { display: flex; gap: 0.5rem; margin-top: 1.25rem; flex-wrap: wrap; }
    .btn { flex: 1; min-width: 120px; padding: 0.75rem; background: #0284c7; color: #ffffff; border: none; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn:hover { background: #0369a1; transform: translateY(-1px); }
    .btn-anim { background: #059669; }
    .btn-anim:hover { background: #047857; }
    .btn-img { background: #d97706; }
    .btn-img:hover { background: #b45309; }
    .btn:disabled { background: #475569; cursor: not-allowed; transform: none; }
    
    #status { margin-top: 0.6rem; font-size: 0.85rem; color: #38bdf8; text-align: center; min-height: 1.2rem; font-weight: 500; }
  </style>
</head>
<body>

  <h1>Social Media Produkt- & Banner Generator</h1>
  <p class="subtitle">Inklusive gestochen scharfem HD-Bild-Download für Facebook</p>

  <div class="app-layout">
    
    <!-- STEUERUNG -->
    <div class="controls">
      
      <!-- 1. HINTERGRUND & PRODUKT -->
      <div class="section-head">1. Hintergrund & Produkt</div>
      <div class="field">
        <label>Layout-Stil / Design</label>
        <select id="bgStyle">
          <option value="pureWhite" selected>Reines Weiß (100% Einheitsweiß)</option>
          <option value="warmStudio">Warmes Studio (Beige / Soft)</option>
          <option value="freshGreen">Frisches Natur-Grün</option>
          <option value="royalBlue">Elegantes Premium Blau</option>
          <option value="modernClean">Modernes Slate / Dunkel</option>
        </select>
      </div>
      <div class="field">
        <label>Produkt-Bild hochladen</label>
        <input type="file" id="fgInput" accept="image/*">
      </div>
      <div class="grid-3">
        <div class="field">
          <label>Größe</label>
          <input type="range" id="fgScale" min="0.1" max="1.5" step="0.02" value="0.7">
        </div>
        <div class="field">
          <label>Pos X</label>
          <input type="range" id="fgX" min="0" max="2160" value="1040">
        </div>
        <div class="field">
          <label>Pos Y</label>
          <input type="range" id="fgY" min="0" max="2160" value="360">
        </div>
      </div>

      <!-- 2. XXL PROMO BADGE -->
      <div class="section-head">2. XXL Promo-Badge</div>
      <div class="field">
        <label>Promo-Aktion</label>
        <select id="promoBadgeType">
          <option value="SPECIAL OFFER">SPECIAL OFFER</option>
          <option value="PROMOTION">PROMOTION</option>
          <option value="BIG DISCOUNT">BIG DISCOUNT</option>
          <option value="BEST SELLER">BEST SELLER</option>
          <option value="LIMITED STOCK">LIMITED STOCK</option>
          <option value="Custom">Eigener Text...</option>
        </select>
      </div>
      <div class="field" id="customPromoGroup" style="display: none;">
        <label>Eigener Promo-Text</label>
        <input type="text" id="customPromoText" value="SPECIAL DEAL">
      </div>
      <div class="grid-3">
        <div class="field">
          <label>Badge-Farbe</label>
          <input type="color" id="promoColor" value="#e11d48">
        </div>
        <div class="field">
          <label>Pos X</label>
          <input type="number" id="promoX" value="1240">
        </div>
        <div class="field">
          <label>Pos Y</label>
          <input type="number" id="promoY" value="340">
        </div>
      </div>

      <!-- 3. VERFÜGBARKEITS-BADGE -->
      <div class="section-head">3. Verfügbarkeits-Status</div>
      <div class="field">
        <label>Status auswählen</label>
        <select id="statusBadge">
          <option value="Available po">AVAILABLE PO</option>
          <option value="Bukas ulit deliver">BUKAS ULIT DELIVER</option>
          <option value="Pa reserve na po">PA RESERVE NA PO</option>
          <option value="Custom">Eigener Text...</option>
        </select>
      </div>
      <div class="field" id="customStatusGroup" style="display: none;">
        <label>Eigener Status-Text</label>
        <input type="text" id="customStatusText" value="AVAILABLE PO">
      </div>
      <div class="grid-2">
        <div class="field">
          <label>Badge-Farbe</label>
          <input type="color" id="statusColor" value="#2563eb">
        </div>
        <div class="field">
          <label>Ziel Pos Y</label>
          <input type="number" id="statusY" value="140">
        </div>
      </div>

      <!-- 4. ÜBERSCHRIFT & STICHPUNKTE -->
      <div class="section-head">4. Überschrift & Details</div>
      <div class="field">
        <label>Titel-Text</label>
        <input type="text" id="headText" value="Fuji">
      </div>
      <div class="grid-2">
        <div class="field">
          <label>Größe (px)</label>
          <input type="number" id="headSize" value="96">
        </div>
        <div class="field">
          <label>Farbe</label>
          <input type="color" id="headColor" value="#1e293b">
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>Ziel Pos X</label>
          <input type="number" id="headX" value="160">
        </div>
        <div class="field">
          <label>Ziel Pos Y</label>
          <input type="number" id="headY" value="320">
        </div>
      </div>

      <div class="field">
        <label>Stichpunkte (1 pro Zeile)</label>
        <textarea id="propText">✓ Maputi (White / Premium white grain)&#10;✓ Malambot (Soft when cooked)&#10;✓ ILagkitan (Slightly sticky / Cohesive texture)&#10;✓ Mabango (Aromatic / Pleasant aroma)&#10;✓ Hindi agad tumatigas (Stays soft even when cooled)</textarea>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>Größe (px)</label>
          <input type="number" id="propSize" value="40">
        </div>
        <div class="field">
          <label>Farbe</label>
          <input type="color" id="propColor" value="#334155">
        </div>
      </div>

      <!-- 5. PREISTABELLE -->
      <div class="section-head">5. Preistabelle</div>
      <div class="grid-2">
        <div class="field"><label>Gebinde 1 (kg)</label><input type="number" id="p1Kg" value="25"></div>
        <div class="field"><label>Preis 1 (PHP)</label><input type="number" id="p1Php" value="3500"></div>
      </div>
      <div class="field">
        <label>Badge-Text (Gebinde 1)</label>
        <input type="text" id="p1BadgeText" value="BESTER PREIS">
      </div>
      <div class="grid-2">
        <div class="field"><label>Gebinde 2 (kg)</label><input type="number" id="p2Kg" value="10"></div>
        <div class="field"><label>Preis 2 (PHP)</label><input type="number" id="p2Php" value="1500"></div>
      </div>
      <div class="grid-2">
        <div class="field"><label>Gebinde 3 (kg)</label><input type="number" id="p3Kg" value="5"></div>
        <div class="field"><label>Preis 3 (PHP)</label><input type="number" id="p3Php" value="800"></div>
      </div>
      <div class="grid-2">
        <div class="field"><label>Pos X</label><input type="number" id="priceX" value="160"></div>
        <div class="field"><label>Pos Y</label><input type="number" id="priceY" value="960"></div>
      </div>

      <!-- 6. MOTORRAD & BLÖCKE -->
      <div class="section-head">6. Motorrad & Liefer-Blöcke</div>
      <div class="grid-2">
        <div class="field">
          <label>Kasten-Text (Rechts)</label>
          <input type="text" id="delivText" value="FREE DELIVERY">
        </div>
        <div class="field">
          <label>Unterer Streifen-Text</label>
          <input type="text" id="delivSubText" value="Kostenlose Lieferung nach Hause">
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>Unterer Text-Größe (px)</label>
          <input type="number" id="delivSubSize" value="36">
        </div>
        <div class="field">
          <label>Liefer-Farbe</label>
          <input type="color" id="delivColor" value="#16a34a">
        </div>
      </div>
      <div class="field">
        <label>Motorrad Pos Y</label>
        <input type="number" id="delivY" value="1640">
      </div>

      <!-- ACTION BUTTONS -->
      <div class="btn-group">
        <button class="btn btn-anim" id="playBtn">▶ Animation</button>
        <button class="btn btn-img" id="downloadImgBtn">📷 Als Bild speichern</button>
        <button class="btn" id="recordBtn">🎬 Video Export</button>
      </div>
      <div id="status"></div>
    </div>

    <!-- CANVAS VORSCHAU -->
    <div class="preview">
      <canvas id="mainCanvas" width="2160" height="2160"></canvas>
    </div>

  </div>

  <script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    let fgImg = null;
    let animationFrameId = null;
    let startTime = null;

    const ANIMATION_DURATION = 4200;
    const HOLD_DURATION = 1500;

    const inputs = [
      'bgStyle', 'fgInput', 'fgScale', 'fgX', 'fgY',
      'promoBadgeType', 'customPromoText', 'promoColor', 'promoX', 'promoY',
      'statusBadge', 'customStatusText', 'statusColor', 'statusY',
      'headText', 'headSize', 'headColor', 'headX', 'headY',
      'propText', 'propSize', 'propColor',
      'p1Kg', 'p1Php', 'p1BadgeText', 'p2Kg', 'p2Php', 'p3Kg', 'p3Php', 'priceX', 'priceY',
      'delivText', 'delivSubText', 'delivSubSize', 'delivColor', 'delivY'
    ].reduce((acc, id) => {
      acc[id] = document.getElementById(id);
      return acc;
    }, {});

    inputs.statusBadge.addEventListener('change', () => {
      document.getElementById('customStatusGroup').style.display = 
        inputs.statusBadge.value === 'Custom' ? 'block' : 'none';
      renderAtProgress(1.0);
    });

    inputs.promoBadgeType.addEventListener('change', () => {
      document.getElementById('customPromoGroup').style.display = 
        inputs.promoBadgeType.value === 'Custom' ? 'block' : 'none';
      renderAtProgress(1.0);
    });

    inputs.fgInput.addEventListener('change', () => {
      const file = inputs.fgInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => { fgImg = img; renderAtProgress(1.0); };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
    function easeOutBack(x) {
      const c1 = 1.70158;
      return 1 + (c1 + 1) * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }
    function easeOutElastic(x) {
      const c4 = (2 * Math.PI) / 3;
      return x === 0 ? 0 : x === 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * c4) + 1;
    }

    function drawBackground() {
      const style = inputs.bgStyle.value;

      if (style === 'pureWhite') {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 2160, 2160);
        return;
      }

      let grad;
      if (style === 'warmStudio') {
        grad = ctx.createRadialGradient(1600, 600, 100, 1080, 1080, 1600);
        grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.4, '#f5efe6'); grad.addColorStop(1, '#e6dcce');
      } else if (style === 'freshGreen') {
        grad = ctx.createRadialGradient(1600, 800, 200, 1080, 1080, 1700);
        grad.addColorStop(0, '#f0fdf4'); grad.addColorStop(0.6, '#dcfce7'); grad.addColorStop(1, '#bbf7d0');
      } else if (style === 'royalBlue') {
        grad = ctx.createLinearGradient(0, 0, 2160, 2160);
        grad.addColorStop(0, '#f0f9ff'); grad.addColorStop(1, '#bae6fd');
      } else {
        grad = ctx.createLinearGradient(0, 0, 2160, 2160);
        grad.addColorStop(0, '#1e293b'); grad.addColorStop(1, '#0f172a');
      }
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 2160, 2160);

      ctx.fillStyle = style === 'modernClean' ? 'rgba(30, 41, 59, 0.85)' : 'rgba(255, 255, 255, 0.75)';
      ctx.beginPath();
      ctx.roundRect(100, 100, 960, 1960, 48);
      ctx.fill();
    }

    function formatPriceRow(kgVal, phpVal) {
      const kg = parseFloat(kgVal);
      const php = parseFloat(phpVal);
      if (isNaN(kg) || isNaN(php) || kg <= 0) return null;
      return {
        kgStr: `${kg} kg`,
        formattedPhp: `${php.toLocaleString('de-DE')} PHP`,
        perKgStr: `${(php / kg).toFixed(2).replace('.', ',')} PHP / kg`
      };
    }

    function drawStarburst(cx, cy, spikes, outerRadius, innerRadius) {
      let rot = Math.PI / 2 * 3;
      let x = cx;
      let y = cy;
      const step = Math.PI / spikes;

      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fill();
    }

    function drawDeliveryScooter(x, y, scale, moveProgress) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      const isMoving = moveProgress < 1.0;
      const bounce = isMoving ? Math.sin(moveProgress * Math.PI * 30) * 3 : 0;
      ctx.translate(0, bounce);

      const wheelRot = (x / 12) % (Math.PI * 2);

      ctx.fillStyle = 'rgba(15, 23, 42, 0.22)';
      ctx.beginPath();
      ctx.ellipse(0, 8, 96, 16, 0, 0, Math.PI * 2);
      ctx.fill();

      function drawWheel(wx, wy) {
        ctx.save();
        ctx.translate(wx, wy);
        ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(0, 0, 28, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#cbd5e1'; ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();
        ctx.rotate(wheelRot);
        ctx.strokeStyle = '#334155'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(12, 0); ctx.stroke();
        ctx.restore();
      }

      drawWheel(-56, -20);
      drawWheel(52, -20);

      ctx.fillStyle = '#0284c7'; ctx.beginPath(); ctx.roundRect(-44, -40, 92, 20, 8); ctx.fill();
      ctx.fillStyle = '#0369a1'; ctx.beginPath(); ctx.moveTo(28, -36); ctx.lineTo(56, -76); ctx.lineTo(40, -84); ctx.lineTo(16, -40); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.arc(54, -74, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.roundRect(-76, -92, 48, 48, 10); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.roundRect(-70, -72, 36, 10, 4); ctx.fill();

      ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.roundRect(-16, -84, 28, 36, 8); ctx.fill();
      ctx.fillStyle = '#0284c7'; ctx.beginPath(); ctx.arc(0, -100, 18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f8fafc'; ctx.beginPath(); ctx.arc(6, -100, 8, -Math.PI/2, Math.PI/2); ctx.fill();

      ctx.restore();
    }

    function renderAtProgress(progress) {
      ctx.clearRect(0, 0, 2160, 2160);
      drawBackground();

      const isDarkBg = inputs.bgStyle.value === 'modernClean';

      // 1. PRODUKTBILD
      if (fgImg) {
        const scale = parseFloat(inputs.fgScale.value);
        const x = parseInt(inputs.fgX.value);
        const y = parseInt(inputs.fgY.value);
        const w = fgImg.width * scale;
        const h = fgImg.height * scale;

        ctx.save();
        ctx.beginPath();
        ctx.ellipse(x + w / 2, y + h - 30, w * 0.38, 44 * scale, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
        ctx.filter = 'blur(24px)';
        ctx.fill();
        ctx.restore();

        ctx.drawImage(fgImg, x, y, w, h);
      }

      // 2. XXL PROMO BADGE
      const promoText = inputs.promoBadgeType.value === 'Custom' 
        ? inputs.customPromoText.value 
        : inputs.promoBadgeType.value;

      if (promoText) {
        const promoStart = 0.12;
        const promoDuration = 0.28;
        const promoProg = Math.max(0, Math.min(1, (progress - promoStart) / promoDuration));

        if (promoProg > 0) {
          const px = parseInt(inputs.promoX.value);
          const py = parseInt(inputs.promoY.value);

          let baseScale = easeOutBack(promoProg);
          let rotationAngle = (1 - easeOutCubic(promoProg)) * Math.PI * 4;
          let bounceY = 0;
          let pulseScale = 1;

          if (promoProg >= 1.0) {
            const postTime = progress - (promoStart + promoDuration);
            bounceY = -Math.abs(Math.sin(postTime * Math.PI * 12)) * 36;
            pulseScale = 1 + Math.sin(postTime * Math.PI * 14) * 0.07;
          }

          const finalScale = Math.max(0, baseScale * pulseScale * 1.35);

          ctx.save();
          ctx.translate(px, py + bounceY);
          ctx.scale(finalScale, finalScale);
          ctx.rotate(rotationAngle);

          ctx.shadowColor = 'rgba(0,0,0,0.25)';
          ctx.shadowBlur = 36; ctx.shadowOffsetY = 16;

          ctx.fillStyle = inputs.promoColor.value;
          drawStarburst(0, 0, 16, 170, 140);

          ctx.shadowColor = 'transparent';

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(0, 0, 116, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = inputs.promoColor.value;
          ctx.lineWidth = 8;
          ctx.beginPath();
          ctx.arc(0, 0, 106, 0, Math.PI * 2);
          ctx.stroke();

          ctx.font = '900 30px sans-serif';
          ctx.fillStyle = '#0f172a';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          
          const words = promoText.split(' ');
          if (words.length > 1) {
            ctx.fillText(words[0], 0, -18);
            ctx.fillText(words.slice(1).join(' '), 0, 22);
          } else {
            ctx.fillText(promoText, 0, 2);
          }

          ctx.restore();
        }
      }

      // 3. STATUS-BADGE
      const statusValue = inputs.statusBadge.value === 'Custom' 
        ? inputs.customStatusText.value 
        : inputs.statusBadge.value;

      if (statusValue) {
        const statusStart = 0.25;
        const statusDuration = 0.32;
        const statusProg = Math.max(0, Math.min(1, (progress - statusStart) / statusDuration));

        if (statusProg > 0) {
          const easedElastic = easeOutElastic(statusProg);
          const startX = 2360;
          const targetX = 160;
          const currentX = startX - (startX - targetX) * easedElastic;
          const targetY = parseInt(inputs.statusY.value);

          ctx.save();
          ctx.translate(currentX, targetY);

          ctx.shadowColor = 'rgba(0, 0, 0, 0.15)';
          ctx.shadowBlur = 24; ctx.shadowOffsetY = 10;

          ctx.fillStyle = inputs.statusColor.value;
          ctx.beginPath();
          ctx.roundRect(0, 0, 520, 96, 48);
          ctx.fill();

          ctx.shadowColor = 'transparent';

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(56, 48, 32, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = inputs.statusColor.value;
          ctx.lineWidth = 7;
          ctx.beginPath();
          ctx.moveTo(40, 48); ctx.lineTo(52, 60); ctx.lineTo(72, 36);
          ctx.stroke();

          ctx.font = 'bold 32px sans-serif';
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.fillText(statusValue.toUpperCase(), 108, 50);

          ctx.restore();
        }
      }

      // 4. ÜBERSCHRIFT
      const hText = inputs.headText.value;
      if (hText) {
        const headProgress = Math.min(1, progress * 2.2);
        const eased = easeOutCubic(headProgress);
        const targetX = parseInt(inputs.headX.value);
        const targetY = parseInt(inputs.headY.value);

        ctx.save();
        ctx.globalAlpha = eased;
        ctx.font = `bold ${inputs.headSize.value}px sans-serif`;
        ctx.fillStyle = isDarkBg ? '#f8fafc' : inputs.headColor.value;
        ctx.fillText(hText, targetX, targetY - (1 - eased) * 140);
        ctx.restore();
      }

      // 5. STICHPUNKTE
      const pText = inputs.propText.value;
      if (pText) {
        const lines = pText.split('\n').filter(l => l.trim() !== "");
        const fontSize = parseInt(inputs.propSize.value);
        const targetX = parseInt(inputs.headX.value);
        let startY = parseInt(inputs.headY.value) + 90;

        ctx.font = `500 ${fontSize}px sans-serif`;
        ctx.fillStyle = isDarkBg ? '#cbd5e1' : inputs.propColor.value;

        lines.forEach((line, index) => {
          const delay = 0.12 + (index * 0.08); 
          const lineProgress = Math.max(0, Math.min(1, (progress - delay) / 0.25));
          if (lineProgress > 0) {
            const eased = easeOutCubic(lineProgress);
            ctx.save();
            ctx.globalAlpha = eased;
            ctx.fillText(line.trim(), targetX - (1 - eased) * 200, startY);
            ctx.restore();
          }
          startY += fontSize * 1.4;
        });
      }

      // 6. PREISTABELLE
      const priceRows = [
        formatPriceRow(inputs.p1Kg.value, inputs.p1Php.value),
        formatPriceRow(inputs.p2Kg.value, inputs.p2Php.value),
        formatPriceRow(inputs.p3Kg.value, inputs.p3Php.value)
      ].filter(r => r !== null);

      if (priceRows.length > 0) {
        const startX = parseInt(inputs.priceX.value);
        let startY = parseInt(inputs.priceY.value);

        priceRows.forEach((row, index) => {
          const delay = 0.35 + (index * 0.1);
          const rowProgress = Math.max(0, Math.min(1, (progress - delay) / 0.25));

          if (rowProgress > 0) {
            const eased = easeOutCubic(rowProgress);
            const currentX = startX - (1 - eased) * 280;
            const isBestValue = index === 0;

            ctx.save();
            ctx.globalAlpha = eased;

            ctx.shadowColor = 'rgba(15, 23, 42, 0.08)';
            ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.roundRect(currentX, startY, 840, 144, 24); ctx.fill();

            ctx.shadowColor = 'transparent';
            ctx.strokeStyle = isBestValue ? '#0284c7' : '#cbd5e1';
            ctx.lineWidth = isBestValue ? 5 : 2;
            ctx.stroke();

            ctx.fillStyle = isBestValue ? '#0284c7' : '#f1f5f9';
            ctx.beginPath(); ctx.roundRect(currentX + 26, startY + 26, 170, 92, 16); ctx.fill();

            ctx.font = 'bold 40px sans-serif';
            ctx.fillStyle = isBestValue ? '#ffffff' : '#0f172a';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(row.kgStr, currentX + 111, startY + 72);

            ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
            ctx.font = 'bold 44px sans-serif'; ctx.fillStyle = '#0f172a';
            ctx.fillText(row.formattedPhp, currentX + 230, startY + 66);

            ctx.font = '500 28px sans-serif'; ctx.fillStyle = '#64748b';
            ctx.fillText(row.perKgStr, currentX + 230, startY + 108);

            const badgeText = inputs.p1BadgeText.value.trim();
            if (isBestValue && badgeText !== "") {
              ctx.font = 'bold 22px sans-serif';
              const textWidth = ctx.measureText(badgeText).width;
              const badgeWidth = Math.max(170, textWidth + 36);
              const badgeX = currentX + 816 - badgeWidth;

              ctx.fillStyle = '#dcfce7';
              ctx.beginPath(); ctx.roundRect(badgeX, startY + 50, badgeWidth, 44, 12); ctx.fill();
              ctx.fillStyle = '#166534';
              ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
              ctx.fillText(badgeText, badgeX + (badgeWidth / 2), startY + 72);
            }
            ctx.restore();
          }
          startY += 168;
        });
      }

      // 7. MOTORRAD & LIEFER-BLÖCKE
      const delivStart = 0.62;
      if (progress >= delivStart) {
        const moveProgress = Math.min(1, (progress - delivStart) / 0.28);
        const targetY = parseInt(inputs.delivY.value);
        const currentX = -200 + (270 - -200) * easeOutCubic(moveProgress);

        drawDeliveryScooter(currentX, targetY, 2.8, moveProgress);

        if (moveProgress > 0.4) {
          const popProgress = Math.min(1, (moveProgress - 0.4) / 0.6);
          const easedPop = easeOutBack(popProgress);

          ctx.save();
          ctx.translate(currentX + 170, targetY - 44);
          ctx.scale(Math.max(0, easedPop), Math.max(0, easedPop));

          ctx.shadowColor = 'rgba(22, 163, 74, 0.35)'; 
          ctx.shadowBlur = 36; 
          ctx.shadowOffsetY = 12;
          
          ctx.fillStyle = inputs.delivColor.value;
          ctx.beginPath(); 
          ctx.roundRect(0, -64, 480, 116, 28); 
          ctx.fill();

          ctx.shadowColor = 'transparent';
          ctx.font = 'bold 42px sans-serif'; 
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center'; 
          ctx.textBaseline = 'middle';
          ctx.fillText(inputs.delivText.value, 240, -6);

          ctx.restore();
        }

        if (moveProgress > 0.6 && inputs.delivSubText.value.trim() !== "") {
          const subPopProgress = Math.min(1, (moveProgress - 0.6) / 0.4);
          const easedSubPop = easeOutCubic(subPopProgress);

          const totalWidth = 660;
          const subY = targetY + 56;
          const subHeight = 92;
          const subFontSize = parseInt(inputs.delivSubSize.value) || 36;

          ctx.save();
          ctx.translate(currentX - 100, subY);
          ctx.scale(1, Math.max(0, easedSubPop));

          ctx.shadowColor = 'rgba(15, 23, 42, 0.12)'; 
          ctx.shadowBlur = 24; 
          ctx.shadowOffsetY = 8;

          ctx.fillStyle = isDarkBg ? '#334155' : '#ffffff';
          ctx.beginPath(); 
          ctx.roundRect(0, 0, totalWidth, subHeight, 20); 
          ctx.fill();

          ctx.shadowColor = 'transparent';
          ctx.strokeStyle = inputs.delivColor.value;
          ctx.lineWidth = 4;
          ctx.stroke();

          ctx.font = `bold ${subFontSize}px sans-serif`; 
          ctx.fillStyle = isDarkBg ? '#ffffff' : '#0f172a';
          ctx.textAlign = 'center'; 
          ctx.textBaseline = 'middle';
          ctx.fillText(inputs.delivSubText.value, totalWidth / 2, subHeight / 2);

          ctx.restore();
        }
      }
    }

    function playAnimation(onComplete) {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      startTime = null;

      function step(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min(1, elapsed / ANIMATION_DURATION);

        renderAtProgress(progress);

        if (progress < 1) {
          animationFrameId = requestAnimationFrame(step);
        } else if (onComplete) {
          setTimeout(onComplete, HOLD_DURATION);
        }
      }
      animationFrameId = requestAnimationFrame(step);
    }

    // NEU: Funktion zum Herunterladen des Canvas als gestochen scharfes PNG-Bild
    document.getElementById('downloadImgBtn').addEventListener('click', () => {
      // Stellen sicher, dass das Bild im finalen Zustand (vollständig) gerendert ist
      renderAtProgress(1.0);

      statusEl.textContent = "📷 Bild wird erstellt...";
      
      canvas.toBlob(function(blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `fuji-rice-banner-hd.png`;
        a.click();
        
        statusEl.textContent = "✅ HD-Bild erfolgreich heruntergeladen!";
        setTimeout(() => { statusEl.textContent = ""; }, 3000);
      }, 'image/png');
    });

    function recordVideo() {
      statusEl.textContent = "⏺ 2K HD-Video wird aufgenommen...";
      document.getElementById('recordBtn').disabled = true;

      const stream = canvas.captureStream(60);
      let mimeType = 'video/webm;codecs=vp9';
      if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';
      if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/mp4';

      const mediaRecorder = new MediaRecorder(stream, { mimeType, videoBitsRate: 8000000 });
      const chunks = [];

      mediaRecorder.ondataavailable = e => chunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(chunks, { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `fuji-rice-hd-banner.${mimeType.includes('mp4') ? 'mp4' : 'webm'}`;
        a.click();
        
        statusEl.textContent = "✅ HD-Video erfolgreich erstellt!";
        document.getElementById('recordBtn').disabled = false;
      };

      mediaRecorder.start();
      playAnimation(() => mediaRecorder.stop());
    }

    document.getElementById('playBtn').addEventListener('click', () => {
      statusEl.textContent = "▶ Vorschau läuft...";
      playAnimation(() => { statusEl.textContent = ""; });
    });

    document.getElementById('recordBtn').addEventListener('click', recordVideo);

    Object.keys(inputs).forEach(key => {
      if (key !== 'fgInput') {
        inputs[key].addEventListener('input', () => renderAtProgress(1.0));
        inputs[key].addEventListener('change', () => renderAtProgress(1.0));
      }
    });

    renderAtProgress(1.0);
  </script>
</body>
