<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Story Generator Test</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; display: flex; gap: 20px; flex-wrap: wrap; }
    .controls { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 14px; background: #1e1e1e; padding: 20px; border-radius: 8px; }
    label { display: flex; flex-direction: column; font-size: 14px; gap: 6px; }
    input, button { padding: 10px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 15px; }
    button { background: #0084ff; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button:hover { background: #006bce; }
    .preview { flex: 1; min-width: 300px; display: flex; justify-content: center; align-items: center; }
    canvas { max-height: 85vh; width: auto; aspect-ratio: 9/16; border: 1px solid #444; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="controls">
    <h2>Story Generator (Test)</h2>
    <label>Titel / Reissorte:
      <input type="text" id="inputTitle" value="ADARNA">
    </label>
    <label>Eigenschaft (Badge):
      <input type="text" id="inputBadge" value="Malambot">
    </label>
    <label>Produktbild hochladen (PNG/JPG):
      <input type="file" id="inputProduct" accept="image/*">
    </label>
    <button id="btnDownload">Bild herunterladen (1080x1920)</button>
  </div>

  <div class="preview">
    <canvas id="storyCanvas" width="1080" height="1920"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('storyCanvas');
    const ctx = canvas.getContext('2d');

    const state = {
      title: 'ADARNA',
      badge: 'Malambot',
      productImg: null
    };

    // Generiert ein dynamisches Grundbild ohne externe Dateien
    function drawBackground() {
      // Warmes Wheat/Korn-Farbverlaufs-Grundbild
      const grad = ctx.createLinearGradient(0, 0, 0, 1920);
      grad.addColorStop(0, '#B38B59');
      grad.addColorStop(0.4, '#D4A373');
      grad.addColorStop(1, '#FAEDCD');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1080, 1920);

      // Dekorative Hintergrund-Formen
      ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.beginPath();
      ctx.arc(540, 960, 480, 0, Math.PI * 2);
      ctx.fill();
    }

    // Haupt-Renderfunktion
    function render() {
      ctx.clearRect(0, 0, 1080, 1920);

      // 1. LAYER: Grundbild
      drawBackground();

      // 2. LAYER: Safe Zone Indikator (Rot gestrichelt)
      ctx.strokeStyle = 'rgba(255, 0, 0, 0.4)';
      ctx.lineWidth = 4;
      ctx.setLineDash([15, 15]);
      ctx.strokeRect(0, 250, 1080, 1370); // Nutzbare Safe Zone
      ctx.setLineDash([]); // Reset LineDash

      // 3. LAYER: Produktbild (Upload oder Platzhalter)
      if (state.productImg) {
        ctx.drawImage(state.productImg, 100, 600, 450, 750);
      } else {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
        ctx.fillRect(100, 600, 450, 750);
        ctx.fillStyle = '#555';
        ctx.font = '32px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Produktbild hochladen', 325, 975);
      }

      // 4. LAYER: Eigenschafts-Badge (Pill)
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.roundRect(620, 500, 320, 80, 20);
      ctx.fill();

      ctx.font = 'bold 36px sans-serif';
      ctx.fillStyle = '#222222';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(state.badge, 780, 540);

      // 5. LAYER: Titel mit Kontur
      ctx.font = "900 90px 'Arial Black', sans-serif";
      ctx.textAlign = 'center';
      ctx.lineWidth = 14;
      ctx.strokeStyle = '#FFFFFF';
      ctx.strokeText(state.title.toUpperCase(), 540, 380);

      ctx.fillStyle = '#1D3B8B';
      ctx.fillText(state.title.toUpperCase(), 540, 380);
    }

    // Event-Listener
    document.getElementById('inputTitle').addEventListener('input', (e) => {
      state.title = e.target.value;
      render();
    });

    document.getElementById('inputBadge').addEventListener('input', (e) => {
      state.badge = e.target.value;
      render();
    });

    document.getElementById('inputProduct').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            state.productImg = img;
            render();
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('btnDownload').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `story-${state.title.toLowerCase() || 'export'}.png`;
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
    });

    // Initialer Renderaufruf
    render();
  </script>
</body>
</html>
