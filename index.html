<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bild-Overlay Tool</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { max-width: 900px; margin: 2rem auto; padding: 0 1rem; background: #f4f4f9; color: #333; }
    h1 { text-align: center; }
    .controls { background: #fff; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 1.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
    label { display: block; font-weight: bold; margin-bottom: 0.5rem; }
    input[type="file"], input[type="range"] { width: 100%; }
    .slider-group { margin-top: 0.5rem; }
    canvas { max-width: 100%; height: auto; display: block; margin: 0 auto; background: #ddd; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .btn { display: block; width: 100%; padding: 0.8rem; background: #0066cc; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; font-weight: bold; margin-top: 1rem; }
    .btn:hover { background: #0052a3; }
  </style>
</head>
<body>

  <h1>PNG-Overlay Editor</h1>

  <div class="controls">
    <div class="grid">
      <div>
        <label for="bgInput">1. Hintergrundbild (JPG/PNG)</label>
        <input type="file" id="bgInput" accept="image/*">
      </div>
      <div>
        <label for="fgInput">2. Vordergrund (Transpar. PNG)</label>
        <input type="file" id="fgInput" accept="image/png, image/webp">
      </div>
    </div>

    <hr>

    <div class="grid">
      <div class="slider-group">
        <label>Skalierung: <span id="scaleVal">100%</span></label>
        <input type="range" id="scale" min="0.1" max="2" step="0.05" value="1">
      </div>
      <div class="slider-group">
        <label>Position X: <span id="posXVal">0px</span></label>
        <input type="range" id="posX" min="-500" max="500" value="0">
      </div>
      <div class="slider-group">
        <label>Position Y: <span id="posYVal">0px</span></label>
        <input type="range" id="posY" min="-500" max="500" value="0">
      </div>
    </div>

    <button class="btn" id="downloadBtn">Fertiges Bild herunterladen</button>
  </div>

  <canvas id="editorCanvas"></canvas>

  <script>
    const bgInput = document.getElementById('bgInput');
    const fgInput = document.getElementById('fgInput');
    const canvas = document.getElementById('editorCanvas');
    const ctx = canvas.getContext('2d');

    const scaleInput = document.getElementById('scale');
    const posXInput = document.getElementById('posX');
    const posYInput = document.getElementById('posY');

    const scaleVal = document.getElementById('scaleVal');
    const posXVal = document.getElementById('posXVal');
    const posYVal = document.getElementById('posYVal');
    const downloadBtn = document.getElementById('downloadBtn');

    let bgImg = null;
    let fgImg = null;

    // Bild aus Datei-Input laden
    function loadImage(fileInput, callback) {
      const file = fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => callback(img);
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Canvas rendern
    function draw() {
      if (!bgImg) return;

      // Canvas auf Arbeitsgröße des Hintergrundbilds setzen
      canvas.width = bgImg.width;
      canvas.height = bgImg.height;

      // Regler-Reichweiten dynamisch an die Bildgröße anpassen
      posXInput.min = -bgImg.width;
      posXInput.max = bgImg.width;
      posYInput.min = -bgImg.height;
      posYInput.max = bgImg.height;

      // Clear Canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Hintergrund zeichnen
      ctx.drawImage(bgImg, 0, 0);

      // 2. Transparente PNG drüberlegen (Browser verarbeitet Alpha-Kanal automatisch)
      if (fgImg) {
        const scale = parseFloat(scaleInput.value);
        const x = parseInt(posXInput.value);
        const y = parseInt(posYInput.value);

        const w = fgImg.width * scale;
        const h = fgImg.height * scale;

        ctx.drawImage(fgImg, x, y, w, h);
      }
    }

    // Event Listener für Bild-Uploads
    bgInput.addEventListener('change', () => {
      loadImage(bgInput, (img) => {
        bgImg = img;
        draw();
      });
    });

    fgInput.addEventListener('change', () => {
      loadImage(fgInput, (img) => {
        fgImg = img;
        draw();
      });
    });

    // Event Listener für Regler
    [scaleInput, posXInput, posYInput].forEach(input => {
      input.addEventListener('input', () => {
        scaleVal.textContent = `${Math.round(scaleInput.value * 100)}%`;
        posXVal.textContent = `${posXInput.value}px`;
        posYVal.textContent = `${posYInput.value}px`;
        draw();
      });
    });

    // Download-Funktion
    downloadBtn.addEventListener('click', () => {
      if (!bgImg) {
        alert('Bitte lade zuerst ein Hintergrundbild hoch.');
        return;
      }
      const link = document.createElement('a');
      link.download = 'overlay-ergebnis.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
